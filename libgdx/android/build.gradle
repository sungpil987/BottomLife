plugins { id 'com.android.application' }

configurations { natives }

android {
    namespace 'com.bottomlife.rebuild'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bottomlife.rebuild'
        minSdk 24
        targetSdk 28
        versionCode 2
        versionName '0.1.1'
    }
    sourceSets {
        main { jniLibs.srcDirs = ['build/generated/jniLibs'] }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-android:1.13.1'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-armeabi-v7a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-arm64-v8a'
    natives 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-x86_64'
}

tasks.register('copyAndroidNatives') {
    doLast {
        def target = file('build/generated/jniLibs')
        delete target
        def abis = ['armeabi-v7a', 'arm64-v8a', 'x86_64']
        configurations.natives.files.each { jarFile ->
            def abi = abis.find { jarFile.name.contains('natives-' + it) }
            if (abi == null) throw new GradleException('Unknown native ABI: ' + jarFile.name)
            copy {
                from zipTree(jarFile)
                include '*.so'
                into file("$target/$abi")
            }
            if (!file("$target/$abi/libgdx.so").exists()) {
                throw new GradleException("Missing libgdx.so for $abi from $jarFile")
            }
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'copyAndroidNatives' }
