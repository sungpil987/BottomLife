name: BottomLife libGDX Android APK
on:
  push:
    branches: [libgdx-rebuild]
    paths:
      - 'libgdx/**'
      - '.github/workflows/libgdx-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: libgdx
        run: gradle :android:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BottomLife-libGDX-Test-APK
          path: libgdx/android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
