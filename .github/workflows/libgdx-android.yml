name: BottomLife libGDX Android APK
on:
  push:
    branches: [libgdx-rebuild]
    paths:
      - 'libgdx/**'
      - '.github/workflows/libgdx-android.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify Android SDK available on runner
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || { echo 'Android SDK platform 35 missing'; exit 1; }
          echo "SDK verified"
      - name: Build debug APK
        working-directory: libgdx
        run: gradle :android:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BottomLife-libGDX-Test-APK
          path: libgdx/android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
