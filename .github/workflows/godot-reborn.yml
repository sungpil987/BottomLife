name: Godot Reborn APK
on:
  push:
    branches: [reborn-godot]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-reborn.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /root/.local/share/godot/export_templates/4.3.stable/android_debug.apk -d /tmp/check_template 2>/dev/null || true
          ls -la /root/.local/share/godot/export_templates/4.3.stable/ || true
      - name: Import Godot project
        run: godot --headless --path godot --editor --quit
      - name: Export debug APK
        run: |
          mkdir -p godot/build
          godot --headless --path godot --export-debug Android build/BottomLife-Reborn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BottomLife-Reborn-APK
          path: godot/build/BottomLife-Reborn.apk
          if-no-files-found: error
