name: Godot Reborn APK
on:
  push:
    branches: [reborn-godot]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-reborn.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Check engine and Android SDK
        run: |
          godot --version
          test -n "$ANDROID_HOME" || test -n "$ANDROID_SDK_ROOT"
      - name: Import Godot project
        run: godot --headless --path godot --editor --quit
      - name: Export debug APK
        run: |
          mkdir -p godot/build
          godot --headless --path godot --export-debug Android build/BottomLife-Reborn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BottomLife-Reborn-APK
          path: godot/build/BottomLife-Reborn.apk
          if-no-files-found: error
