name: Godot Android Clean Smoke Test
on:
  push:
    branches: [godot-build-recovery]
    paths:
      - 'smoke-test/**'
      - '.github/workflows/godot-smoke-test.yml'
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Install required container utilities
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl unzip ca-certificates openjdk-17-jdk-headless
      - uses: actions/checkout@v4
      - name: Install Godot 4.3 export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz 'templates/android_debug.apk' 'templates/android_release.apk' -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/android_debug.apk /tmp/godot-templates/templates/android_release.apk "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Configure Java, Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}" >> "$GITHUB_ENV"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/opt/android-sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          command -v keytool
          keytool -genkeypair -v -keystore /tmp/reborn-debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          test -d "$SDK"
          test -d "${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=/tmp/reborn-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Install matching Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -d "$ANDROID_HOME/build-tools/34.0.0"
      - name: Configure Godot through editor settings API
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path godot --script res://ci_configure.gd
      - name: Validate Android export prerequisites
        shell: bash
        run: |
          set -euo pipefail
          echo "HOME=$HOME JAVA_HOME=$JAVA_HOME ANDROID_HOME=$ANDROID_HOME"
          java -version
          find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d -print || true
          find "$ANDROID_HOME/platforms" -maxdepth 1 -mindepth 1 -type d -print || true
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          test -s /tmp/reborn-debug.keystore
      - name: Import and validate Godot project
        run: godot --headless --path smoke-test --editor --quit
      - name: Export debug APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-test/build
          godot --headless --verbose --path smoke-test --export-debug Android build/BottomLife-Smoke.apk
          test -s smoke-test/build/BottomLife-Smoke.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BottomLife-Smoke-Test-APK
          path: smoke-test/build/BottomLife-Smoke.apk
          if-no-files-found: error
